{% extends "base.html" %}
{% block title %}Login · Online Examination System{% endblock %}
{% block content %}
<section class="login-wrap">
  <div class="login-card">
    <div class="eyebrow">WELCOME</div>
    <h1>Sign in to continue</h1>
    <p class="muted">Access your examination portal using your demo account.</p>
    <form method="post">
      <label>Username</label><input name="username" autocomplete="username" required placeholder="Enter username">
      <label>Password</label><input type="password" name="password" autocomplete="current-password" required placeholder="Enter password">
      <button class="btn btn-primary full" type="submit">Login</button>
    </form>
    <div class="demo-box"><strong>Demo accounts</strong><br>Student: <code>student / student123</code><br>Admin: <code>admin / admin123</code></div>
  </div>
</section>
{% endblock %}
